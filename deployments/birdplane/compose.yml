# Production Git-connected Coolify application in Raw Compose mode.
# Credentials are supplied by Coolify; existing volumes must already exist.
# Build paths are relative to the repository root (Coolify Base Directory: /).
services:
  web:
    image: birdplane-web:git-compose
    depends_on:
      - api
      - worker
    restart: unless-stopped
    pull_policy: never
    build:
      context: .
      dockerfile: apps/web/Dockerfile.web
    labels:
      - coolify.managed=true
      - coolify.applicationId=${BIRDPLANE_APPLICATION_ID:?Set BIRDPLANE_APPLICATION_ID
        in Coolify}
      - coolify.applicationUuid=${BIRDPLANE_APPLICATION_UUID:?Set BIRDPLANE_APPLICATION_UUID
        in Coolify}
      - coolify.type=application
      - coolify.pullRequestId=0
  space:
    image: makeplane/plane-space:v1.4.2
    depends_on:
      - api
      - worker
      - web
    restart: unless-stopped
    labels:
      - coolify.managed=true
      - coolify.applicationId=${BIRDPLANE_APPLICATION_ID:?Set BIRDPLANE_APPLICATION_ID
        in Coolify}
      - coolify.applicationUuid=${BIRDPLANE_APPLICATION_UUID:?Set BIRDPLANE_APPLICATION_UUID
        in Coolify}
      - coolify.type=application
      - coolify.pullRequestId=0
  admin:
    image: makeplane/plane-admin:v1.4.2
    depends_on:
      - api
      - web
    restart: unless-stopped
    labels:
      - coolify.managed=true
      - coolify.applicationId=${BIRDPLANE_APPLICATION_ID:?Set BIRDPLANE_APPLICATION_ID
        in Coolify}
      - coolify.applicationUuid=${BIRDPLANE_APPLICATION_UUID:?Set BIRDPLANE_APPLICATION_UUID
        in Coolify}
      - coolify.type=application
      - coolify.pullRequestId=0
  live:
    image: makeplane/plane-live:v1.4.2
    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_URL: ${REDIS_URL}
      API_BASE_URL: ${API_BASE_URL}
      LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY:?Set LIVE_SERVER_SECRET_KEY
        in Coolify}
    depends_on:
      - api
      - web
    restart: unless-stopped
    labels:
      - coolify.managed=true
      - coolify.applicationId=${BIRDPLANE_APPLICATION_ID:?Set BIRDPLANE_APPLICATION_ID
        in Coolify}
      - coolify.applicationUuid=${BIRDPLANE_APPLICATION_UUID:?Set BIRDPLANE_APPLICATION_UUID
        in Coolify}
      - coolify.type=application
      - coolify.pullRequestId=0
  api:
    image: birdplane-backend:git-compose
    command: ./bin/docker-entrypoint-api.sh
    volumes:
      - logs_api:/code/plane/logs
    environment: &id001
      APP_DOMAIN: ${APP_DOMAIN}
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT}
      CERT_EMAIL: ${CERT_EMAIL}
      CERT_ACME_CA: ${CERT_ACME_CA}
      CERT_ACME_DNS: ${CERT_ACME_DNS}
      LISTEN_HTTP_PORT: ${LISTEN_HTTP_PORT}
      LISTEN_HTTPS_PORT: ${LISTEN_HTTPS_PORT}
      BUCKET_NAME: ${BUCKET_NAME}
      SITE_ADDRESS: ${SITE_ADDRESS}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID in Coolify}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY in
        Coolify}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in Coolify}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_URL: ${REDIS_URL}
      PGHOST: ${PGHOST}
      PGDATABASE: ${PGDATABASE}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Coolify}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: ${POSTGRES_PORT}
      PGDATA: ${PGDATA}
      WEB_URL: ${WEB_URL}
      DEBUG: ${DEBUG}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS}
      USE_MINIO: ${USE_MINIO}
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in Coolify}
      AMQP_URL: ${AMQP_URL}
      API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT}
      MINIO_ENDPOINT_SSL: ${MINIO_ENDPOINT_SSL}
      LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY:?Set LIVE_SERVER_SECRET_KEY
        in Coolify}
      WEBHOOK_ALLOWED_IPS: ${WEBHOOK_ALLOWED_IPS}
      WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS}
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      plane-mq:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped
    pull_policy: never
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
    labels:
      - coolify.managed=true
      - coolify.applicationId=${BIRDPLANE_APPLICATION_ID:?Set BIRDPLANE_APPLICATION_ID
        in Coolify}
      - coolify.applicationUuid=${BIRDPLANE_APPLICATION_UUID:?Set BIRDPLANE_APPLICATION_UUID
        in Coolify}
      - coolify.type=application
      - coolify.pullRequestId=0
  worker:
    image: birdplane-backend:git-compose
    command: ./bin/docker-entrypoint-worker.sh
    volumes:
      - logs_worker:/code/plane/logs
    environment: *id001
    depends_on:
      api:
        condition: service_started
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      plane-mq:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped
    pull_policy: never
    labels:
      - coolify.managed=true
      - coolify.applicationId=${BIRDPLANE_APPLICATION_ID:?Set BIRDPLANE_APPLICATION_ID
        in Coolify}
      - coolify.applicationUuid=${BIRDPLANE_APPLICATION_UUID:?Set BIRDPLANE_APPLICATION_UUID
        in Coolify}
      - coolify.type=application
      - coolify.pullRequestId=0
  beat-worker:
    image: birdplane-backend:git-compose
    command: ./bin/docker-entrypoint-beat.sh
    volumes:
      - logs_beat-worker:/code/plane/logs
    environment: *id001
    depends_on:
      api:
        condition: service_started
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      plane-mq:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped
    pull_policy: never
    labels:
      - coolify.managed=true
      - coolify.applicationId=${BIRDPLANE_APPLICATION_ID:?Set BIRDPLANE_APPLICATION_ID
        in Coolify}
      - coolify.applicationUuid=${BIRDPLANE_APPLICATION_UUID:?Set BIRDPLANE_APPLICATION_UUID
        in Coolify}
      - coolify.type=application
      - coolify.pullRequestId=0
  migrator:
    image: birdplane-backend:git-compose
    command: ./bin/docker-entrypoint-migrator.sh
    volumes:
      - logs_migrator:/code/plane/logs
    environment: *id001
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
    restart: "no"
    pull_policy: never
    labels:
      - coolify.managed=true
      - coolify.applicationId=${BIRDPLANE_APPLICATION_ID:?Set BIRDPLANE_APPLICATION_ID
        in Coolify}
      - coolify.applicationUuid=${BIRDPLANE_APPLICATION_UUID:?Set BIRDPLANE_APPLICATION_UUID
        in Coolify}
      - coolify.type=application
      - coolify.pullRequestId=0
  plane-db:
    image: postgres:15.7-alpine
    command: postgres -c 'max_connections=1000'
    environment:
      PGHOST: ${PGHOST}
      PGDATABASE: ${PGDATABASE}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Coolify}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: ${POSTGRES_PORT}
      PGDATA: ${PGDATA}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U plane -d plane
      interval: 10s
      timeout: 5s
      retries: 12
    labels:
      - coolify.managed=true
      - coolify.applicationId=${BIRDPLANE_APPLICATION_ID:?Set BIRDPLANE_APPLICATION_ID
        in Coolify}
      - coolify.applicationUuid=${BIRDPLANE_APPLICATION_UUID:?Set BIRDPLANE_APPLICATION_UUID
        in Coolify}
      - coolify.type=application
      - coolify.pullRequestId=0
  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - valkey-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 12
    labels:
      - coolify.managed=true
      - coolify.applicationId=${BIRDPLANE_APPLICATION_ID:?Set BIRDPLANE_APPLICATION_ID
        in Coolify}
      - coolify.applicationUuid=${BIRDPLANE_APPLICATION_UUID:?Set BIRDPLANE_APPLICATION_UUID
        in Coolify}
      - coolify.type=application
      - coolify.pullRequestId=0
  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    environment:
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in
        Coolify}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 15s
      timeout: 10s
      retries: 12
    labels:
      - coolify.managed=true
      - coolify.applicationId=${BIRDPLANE_APPLICATION_ID:?Set BIRDPLANE_APPLICATION_ID
        in Coolify}
      - coolify.applicationUuid=${BIRDPLANE_APPLICATION_UUID:?Set BIRDPLANE_APPLICATION_UUID
        in Coolify}
      - coolify.type=application
      - coolify.pullRequestId=0
  plane-minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /export --console-address ":9090"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in Coolify}
    volumes:
      - uploads:/export
    restart: unless-stopped
    labels:
      - coolify.managed=true
      - coolify.applicationId=${BIRDPLANE_APPLICATION_ID:?Set BIRDPLANE_APPLICATION_ID
        in Coolify}
      - coolify.applicationUuid=${BIRDPLANE_APPLICATION_UUID:?Set BIRDPLANE_APPLICATION_UUID
        in Coolify}
      - coolify.type=application
      - coolify.pullRequestId=0
  proxy:
    image: makeplane/plane-proxy:v1.4.2
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT}
      CERT_EMAIL: ${CERT_EMAIL}
      CERT_ACME_CA: ${PROXY_CERT_ACME_CA}
      CERT_ACME_DNS: ${CERT_ACME_DNS}
      LISTEN_HTTP_PORT: ${LISTEN_HTTP_PORT}
      LISTEN_HTTPS_PORT: ${LISTEN_HTTPS_PORT}
      BUCKET_NAME: ${BUCKET_NAME}
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - proxy_config:/config
      - proxy_data:/data
    depends_on:
      - web
      - api
      - space
      - admin
      - live
    restart: unless-stopped
    expose:
      - "80"
    labels:
      - coolify.managed=true
      - coolify.applicationId=${BIRDPLANE_APPLICATION_ID:?Set BIRDPLANE_APPLICATION_ID
        in Coolify}
      - coolify.applicationUuid=${BIRDPLANE_APPLICATION_UUID:?Set BIRDPLANE_APPLICATION_UUID
        in Coolify}
      - coolify.type=application
      - coolify.pullRequestId=0
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.birdplane-git-http.entrypoints=http
      - traefik.http.routers.birdplane-git-http.rule=Host(`plane.audiopoesis.com`) &&
        PathPrefix(`/`)
      - traefik.http.routers.birdplane-git-http.middlewares=redirect-to-https
      - traefik.http.routers.birdplane-git-http.service=birdplane-git
      - traefik.http.routers.birdplane-git-https.entrypoints=https
      - traefik.http.routers.birdplane-git-https.rule=Host(`plane.audiopoesis.com`)
        && PathPrefix(`/`)
      - traefik.http.routers.birdplane-git-https.tls=true
      - traefik.http.routers.birdplane-git-https.tls.certresolver=letsencrypt
      - traefik.http.routers.birdplane-git-https.middlewares=gzip
      - traefik.http.routers.birdplane-git-https.service=birdplane-git
      - traefik.http.services.birdplane-git.loadbalancer.server.port=80
    networks:
      - default
      - coolify
volumes:
  pgdata:
    external: true
    name: hnslaatmrmfginhfa1kemiam_pgdata
  redisdata:
    external: true
    name: hnslaatmrmfginhfa1kemiam_redisdata
  uploads:
    external: true
    name: hnslaatmrmfginhfa1kemiam_uploads
  logs_api:
    external: true
    name: hnslaatmrmfginhfa1kemiam_logs-api
  logs_worker:
    external: true
    name: hnslaatmrmfginhfa1kemiam_logs-worker
  logs_beat-worker:
    external: true
    name: hnslaatmrmfginhfa1kemiam_logs-beat-worker
  logs_migrator:
    external: true
    name: hnslaatmrmfginhfa1kemiam_logs-migrator
  rabbitmq_data:
    external: true
    name: hnslaatmrmfginhfa1kemiam_rabbitmq-data
  proxy_config:
    external: true
    name: hnslaatmrmfginhfa1kemiam_proxy-config
  proxy_data:
    external: true
    name: hnslaatmrmfginhfa1kemiam_proxy-data
networks:
  default:
    name: birdplane-git-compose
  coolify:
    external: true
    name: coolify
